name: Build Alir APK

# Builds the Alir browser (Fulguris fork) on GitHub's runners, where the
# Gradle daemon works normally. Produces an UNSIGNED release APK
# (package com.alir.browser, no .debug suffix) for direct download from
# alir.web.id. The APK is signed manually after download with a real
# release keystore (see alir-release-prep/README.md) -- there is no
# signing config in app/build.gradle, so Gradle cannot sign it in CI.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # No setup-android step: GitHub's ubuntu runners already ship an
      # Android SDK with ANDROID_HOME set, and setup-android@v3 failed
      # on this repo's runs before reaching the build.
      - name: Install Android SDK 36 + build-tools 35
        # No `yes |` pipe here on purpose: Actions run steps use
        # `bash -eo pipefail`, so `yes` dying with SIGPIPE after sdkmanager
        # exits would fail the step even when the install succeeded.
        # Licenses are pre-accepted via hash files instead.
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf '8933bad161af4178b1185d1a37fbf41ea526' > "$ANDROID_HOME/licenses/android-sdk-license"
          printf '84831b9409646a918e30573bab4c9cdd' > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"

      - name: Build release APK (fdroid flavor, no Firebase, unsigned)
        run: ./gradlew assembleSlionsFullFdroidRelease --stacktrace

      - name: Verify release APK (package + version)
        run: |
          ls -l app/build/outputs/apk/slionsFullFdroid/release/
          for apk in app/build/outputs/apk/slionsFullFdroid/release/*.apk; do
            "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$apk" | head -2
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Alir-APK
          path: app/build/outputs/apk/slionsFullFdroid/release/*.apk
