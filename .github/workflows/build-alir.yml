name: Build Alir APK

# Builds the Alir browser (Fulguris fork) on GitHub's runners, where the
# Gradle daemon works normally. Produces a debug-signed APK that installs
# straight onto a phone for testing (package com.alir.browser.debug).
# A signed release build comes later, once a real keystore exists.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36 + build-tools 35
        # No `yes |` pipe here on purpose: Actions run steps use
        # `bash -eo pipefail`, so `yes` dying with SIGPIPE after sdkmanager
        # exits would fail the step even when the install succeeded.
        # Licenses are pre-accepted via hash files instead.
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf '8933bad161af4178b1185d1a37fbf41ea526' > "$ANDROID_HOME/licenses/android-sdk-license"
          printf '84831b9409646a918e30573bab4c9cdd' > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"

      - name: Build debug APK (fdroid flavor, no Firebase)
        run: ./gradlew assembleSlionsFullFdroidDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Alir-APK
          path: app/build/outputs/apk/slionsFullFdroid/debug/*.apk
